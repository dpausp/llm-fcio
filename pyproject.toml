[project]
name = "llm-fcio"
version = "0.1"
requires-python = ">=3.14"
dependencies = ["llm", "httpx", "httpx-sse", "pathspec", "sqlite-utils", "rich"]

[project.entry-points.llm]
fcio = "llm_fcio"

[dependency-groups]
docs = [
    "sphinx>=8.0.0",
    "sphinx-autoapi>=3.0.0",
    "myst-parser>=4.0.0",
    "furo>=2024.0.0",
    "sphinx-autodoc-typehints>=3.0.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-design>=0.6.0",
    "sphinx-llm>=0.3.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
addopts = ["--tb=short", "--durations=0"]
testpaths = ["tests"]
