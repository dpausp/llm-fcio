[project]
name = "llm-fcio"
version = "0.1"
requires-python = ">=3.14"
dependencies = ["llm", "httpx", "httpx-sse", "pathspec", "sqlite-utils", "rich"]

[project.entry-points.llm]
fcio = "llm_fcio"

[dependency-groups]
docs = [
    "sphinx>=8.0.0",
    "sphinx-autoapi>=3.0.0",
    "myst-parser>=4.0.0",
    "furo>=2024.0.0",
    "sphinx-autodoc-typehints>=3.0.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-design>=0.6.0",
    "sphinx-llm>=0.3.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
addopts = ["--tb=short", "--cov=llm_fcio", "--cov-report=term-missing", "--durations=0"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TCH", "BLE", "B904"]
ignore = ["E501", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/impl_spec/test_quality_elevation.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"
