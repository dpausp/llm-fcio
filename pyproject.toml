[project]
name = "llm-fcio"
version = "2026.5.19a1"
requires-python = ">=3.14"
dependencies = ["llm>=0.31", "httpx>=0.28.1", "httpx-sse>=0.4.3", "pathspec>=1.1.1", "sqlite-utils>=3.39", "rich>=15.0.0", "pygments>=2.20.0", "pydantic>=2.13.3"]

[project.entry-points.llm]
fcio = "llm_fcio"

[dependency-groups]
docs = [
    "sphinx>=8.0.0",
    "sphinx-autoapi>=3.0.0",
    "myst-parser>=4.0.0",
    "furo>=2024.0.0",
    "sphinx-autodoc-typehints>=3.0.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-design>=0.6.0",
    "sphinx-llm>=0.3.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "respx>=0.23.1",
    "tox>=4.0.0",
    "tox-uv>=0.0.1",
    "pip-audit>=0.3.0",
    "hypothesis>=6.0.0",
]
[tool.pytest.ini_options]
addopts = ["--tb=short", "--cov=llm_fcio", "--cov-report=term-missing", "--durations=0"]
testpaths = ["tests"]
import_mode = "importlib"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ANN", "E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TCH", "BLE", "B904", "RUF012", "RET504", "FURB110", "PLW2901"]
ignore = ["E501", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/impl_spec/test_quality_elevation.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"

[tool.tox]
env_list = ["lint", "type", "cov"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]

[tool.tox.env.lint]
description = "Run ruff linter and format check"
skip_install = true
allowlist_externals = ["ruff"]
commands = [
  ["ruff", "check", "."],
  ["ruff", "format", "--check", "."],
]

[tool.tox.env.type]
description = "Run ty type checker"
skip_install = true
allowlist_externals = ["ty"]
commands = [
  ["ty", "check", "llm_fcio.py"],
]

[tool.tox.env.cov]
description = "Run tests with coverage"
commands = [
  ["pytest"],
]
